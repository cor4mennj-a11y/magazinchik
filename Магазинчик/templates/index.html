
<script>
    /* =========================
       КОРЗИНА
    ========================= */

    let cart = [];

    function addToCart(id, name, price, image, emoji) {
        id = Number(id);
        price = Number(price);

        if (!Number.isInteger(id) || id <= 0) {
            alert("Не удалось определить товар. Обнови страницу.");
            return;
        }

        if (!Number.isFinite(price) || price < 0) {
            alert("Некорректная цена товара.");
            return;
        }

        const existing = cart.find(item => item.id === id);

        if (existing) {
            existing.quantity += 1;
        } else {
            cart.push({
                id: id,
                name: name,
                price: price,
                image: image || "",
                emoji: emoji || "🌸",
                quantity: 1
            });
        }

        updateCart();
        openCart();
    }


    function removeFromCart(index) {
        if (!cart[index]) return;

        cart.splice(index, 1);
        updateCart();
    }


    function changeQuantity(index, change) {
        if (!cart[index]) return;

        cart[index].quantity += change;

        if (cart[index].quantity <= 0) {
            cart.splice(index, 1);
        }

        updateCart();
    }


    function getCartCount() {
        return cart.reduce(
            (sum, item) => sum + item.quantity,
            0
        );
    }


    function getCartTotal() {
        return cart.reduce(
            (sum, item) => sum + item.price * item.quantity,
            0
        );
    }


    function formatPrice(value) {
        return Number(value).toLocaleString("ru-RU", {
            maximumFractionDigits: 2
        });
    }


    function escapeHtml(value) {
        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    function updateCart() {
        const cartItems = document.getElementById("cartItems");
        const cartCount = document.getElementById("cartCount");
        const cartTotal = document.getElementById("cartTotal");

        cartCount.textContent = getCartCount();
        cartTotal.textContent = formatPrice(getCartTotal()) + " ₽";

        if (cart.length === 0) {
            cartItems.innerHTML = `
                <div class="empty-cart">
                    <div class="empty-cart-icon">🛍️</div>
                    <strong>Корзина пока пустая</strong>
                    <p>Добавь сюда свой любимый букет.</p>
                </div>
            `;
            return;
        }

        let html = "";

        cart.forEach((item, index) => {
            let imageHtml = "";

            if (item.image) {
                imageHtml = `
                    <img
                        src="${escapeHtml(item.image)}"
                        alt=""
                        onerror="
                            this.style.display='none';
                            this.nextElementSibling.style.display='block';
                        "
                    >
                    <div
                        class="cart-item-emoji"
                        style="display:none;"
                    >
                        ${escapeHtml(item.emoji)}
                    </div>
                `;
            } else {
                imageHtml = `
                    <div class="cart-item-emoji">
                        ${escapeHtml(item.emoji)}
                    </div>
                `;
            }

            html += `
                <div class="cart-item">
                    <div class="cart-item-image">
                        ${imageHtml}
                    </div>

                    <div class="cart-item-info">
                        <div class="cart-item-name">
                            ${escapeHtml(item.name)}
                        </div>

                        <div class="cart-item-price">
                            ${formatPrice(item.price)} ₽ × ${item.quantity}
                        </div>
                    </div>

                    <div class="quantity">
                        <button
                            type="button"
                            onclick="changeQuantity(${index}, -1)"
                            aria-label="Уменьшить количество"
                        >−</button>

                        <span>${item.quantity}</span>

                        <button
                            type="button"
                            onclick="changeQuantity(${index}, 1)"
                            aria-label="Увеличить количество"
                        >+</button>
                    </div>

                    <button
                        type="button"
                        class="remove-item"
                        onclick="removeFromCart(${index})"
                        title="Удалить товар"
                        aria-label="Удалить товар"
                    >×</button>
                </div>
            `;
        });

        cartItems.innerHTML = html;
    }


    /* =========================
       ОТКРЫТИЕ И ЗАКРЫТИЕ КОРЗИНЫ
    ========================= */

    function openCart() {
        document.getElementById("cartPanel").classList.add("show");
        document.getElementById("overlay").classList.add("show");
        document.body.classList.add("modal-open");
    }


    function closeCart() {
        document.getElementById("cartPanel").classList.remove("show");
        document.getElementById("overlay").classList.remove("show");

        updateBodyLock();
    }


    /* =========================
       КАРТОЧКА ТОВАРА
    ========================= */

    function openProductModalFromCard(card) {
        const id = card.dataset.id;
        const name = card.dataset.productName || "";
        const price = card.dataset.productPrice || "0";
        const image = card.dataset.productImage || "";
        const emoji = card.dataset.productEmoji || "🌸";
        const description = card.dataset.productDescription || "";

        openProductModal(
            id,
            name,
            price,
            image,
            emoji,
            description
        );
    }


    function openProductModal(id, name, price, image, emoji, description) {
        const modal = document.getElementById("productModalOverlay");
        const imageContainer = document.getElementById("productModalImage");
        const nameElement = document.getElementById("productModalName");
        const descriptionElement = document.getElementById("productModalDescription");
        const priceElement = document.getElementById("productModalPrice");
        const addButton = document.getElementById("productModalAddButton");

        nameElement.textContent = name;

        descriptionElement.textContent =
            description || "Красивый свежий букет для особенного момента.";

        priceElement.textContent = formatPrice(price) + " ₽";

        if (image) {
            imageContainer.innerHTML = `
                <img
                    src="${escapeHtml(image)}"
                    alt="${escapeHtml(name)}"
                    onerror="
                        this.style.display='none';
                        this.nextElementSibling.style.display='block';
                    "
                >
                <div
                    class="product-modal-emoji"
                    style="display:none;"
                >
                    ${escapeHtml(emoji)}
                </div>
            `;
        } else {
            imageContainer.innerHTML = `
                <div class="product-modal-emoji">
                    ${escapeHtml(emoji)}
                </div>
            `;
        }

        addButton.onclick = function() {
            addToCart(id, name, price, image, emoji);
            closeProductModal();
        };

        modal.classList.add("show");
        document.body.classList.add("modal-open");
    }


    function closeProductModal() {
        document
            .getElementById("productModalOverlay")
            .classList.remove("show");

        updateBodyLock();
    }


    function closeProductModalOnOverlay(event) {
        if (
            event.target ===
            document.getElementById("productModalOverlay")
        ) {
            closeProductModal();
        }
    }


    /* =========================
       ОФОРМЛЕНИЕ ЗАКАЗА
    ========================= */

    function openOrderModal() {
        if (cart.length === 0) {
            alert("Сначала добавь товар в корзину.");
            return;
        }

        updateOrderSummary();
        closeCart();

        document
            .getElementById("orderModal")
            .classList.add("show");

        document.body.classList.add("modal-open");
    }


    function closeOrderModal() {
        document
            .getElementById("orderModal")
            .classList.remove("show");

        updateBodyLock();
    }


    function updateOrderSummary() {
        const summary = document.getElementById("orderSummary");

        let html = "";

        cart.forEach(item => {
            html += `
                <div class="order-summary-line">
                    <span>
                        ${escapeHtml(item.name)} × ${item.quantity}
                    </span>

                    <span>
                        ${formatPrice(item.price * item.quantity)} ₽
                    </span>
                </div>
            `;
        });

        html += `
            <div
                class="order-summary-line"
                style="
                    margin-top: 9px;
                    padding-top: 12px;
                    border-top: 1px solid #D8F1ED;
                    color: #263B3B;
                    font-weight: 900;
                "
            >
                <span>Итого</span>

                <span style="color:#ED78A9;">
                    ${formatPrice(getCartTotal())} ₽
                </span>
            </div>
        `;

        summary.innerHTML = html;
    }


    /* =========================
       ОТПРАВКА ЗАКАЗА НА СЕРВЕР
    ========================= */

    document
        .getElementById("orderForm")
        .addEventListener("submit", async function(event) {
            event.preventDefault();

            if (cart.length === 0) {
                alert("Корзина пустая.");
                return;
            }

            const name = document
                .getElementById("customerName")
                .value
                .trim();

            const phone = document
                .getElementById("customerPhone")
                .value
                .trim();

            const address = document
                .getElementById("customerAddress")
                .value
                .trim();

            const button = document.querySelector(".submit-order");

            if (!name || !phone || !address) {
                alert("Заполни все поля формы.");
                return;
            }

            button.disabled = true;
            button.textContent = "Отправляем заказ...";

            try {
                const response = await fetch("/send-order", {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        name: name,
                        phone: phone,
                        address: address,

                        items: cart.map(item => ({
                            id: item.id,
                            quantity: item.quantity
                        }))
                    })
                });

                let result;

                try {
                    result = await response.json();
                } catch {
                    throw new Error("Сервер вернул некорректный ответ.");
                }

                if (response.ok && result.success) {
                    document
                        .getElementById("orderFormContainer")
                        .innerHTML = `
                            <div class="success">
                                <div class="success-icon">🎉</div>

                                <h2>Заказ отправлен!</h2>

                                <p>
                                    Спасибо за заказ!
                                    Мы свяжемся с тобой
                                    в ближайшее время.
                                </p>

                                <button
                                    type="button"
                                    class="submit-order"
                                    onclick="finishOrder()"
                                >
                                    Отлично 💗
                                </button>
                            </div>
                        `;

                    cart = [];
                    updateCart();
                } else {
                    alert(
                        result.error ||
                        "Не удалось отправить заказ."
                    );

                    button.disabled = false;
                    button.textContent = "💗 Подтвердить заказ";
                }
            } catch (error) {
                console.error("Ошибка отправки заказа:", error);

                alert(
                    error.message ||
                    "Ошибка соединения с сервером. Попробуй ещё раз."
                );

                button.disabled = false;
                button.textContent = "💗 Подтвердить заказ";
            }
        });


    function finishOrder() {
        location.reload();
    }


    /* =========================
       ПОИСК ТОВАРОВ
    ========================= */

    const searchInput = document.getElementById("searchInput");
    const productCards = document.querySelectorAll(".product-card");
    const noSearchResults = document.getElementById("noSearchResults");

    if (searchInput) {
        searchInput.addEventListener("input", function() {
            const query = this.value.toLowerCase().trim();

            let visibleCount = 0;

            productCards.forEach(card => {
                const name = card.dataset.name || "";

                if (name.includes(query)) {
                    card.style.display = "";
                    visibleCount++;
                } else {
                    card.style.display = "none";
                }
            });

            if (noSearchResults) {
                noSearchResults.style.display =
                    visibleCount === 0 && query !== ""
                        ? "block"
                        : "none";
            }
        });
    }


    /* =========================
       БЛОКИРОВКА ПРОКРУТКИ
    ========================= */

    function updateBodyLock() {
        const productModalOpen = document
            .getElementById("productModalOverlay")
            .classList.contains("show");

        const orderModalOpen = document
            .getElementById("orderModal")
            .classList.contains("show");

        const cartOpen = document
            .getElementById("cartPanel")
            .classList.contains("show");

        if (productModalOpen || orderModalOpen || cartOpen) {
            document.body.classList.add("modal-open");
        } else {
            document.body.classList.remove("modal-open");
        }
    }


    /* =========================
       ЗАКРЫТИЕ ПО ESC
    ========================= */

    document.addEventListener("keydown", function(event) {
        if (event.key === "Escape") {
            closeProductModal();
            closeCart();
            closeOrderModal();
        }
    });


    /* =========================
       ДОБАВЛЕНИЕ ТОВАРА ИЗ КНОПКИ
    ========================= */

    document.querySelectorAll(".add-button").forEach(button => {
        button.addEventListener("click", function(event) {
            event.stopPropagation();

            const card = this.closest(".product-card");

            if (!card) return;

            addToCart(
                card.dataset.id,
                this.dataset.name,
                this.dataset.price,
                this.dataset.image,
                this.dataset.emoji
            );
        });
    });


    /* =========================
       СТАРТ
    ========================= */

    updateCart();
</script>
